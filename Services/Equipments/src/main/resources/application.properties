spring.application.name=Equipments
server.port=5106

logging.level.org.springframework.data.r2dbc=DEBUG

spring.sql.init.mode=never

# RFC 9457 ProblemDetails for error responses
spring.webflux.problem-details.enabled=true

# ===== File Upload =====
spring.webflux.multipart.max-parts=10
spring.webflux.multipart.max-disk-usage-per-part=10MB
app.upload.dir=uploads/images

# ===== JWT (Identity Service) =====
# Aspire injects services__identity-api__http__0 via WithReference
app.jwt.authority=${services__identity-api__http__0:http://identity-api}
app.jwt.issuer=http://identity-api

# ===== RabbitMQ =====
# Aspire expects ConnectionStrings__rabbitmq for direct connection strings
# Fallback for local dev without Aspire
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
